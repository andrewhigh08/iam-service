[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# sub is "user:<id>" or "role:<name>", obj is a resource such as "users", act is "read" or "write".
m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act
