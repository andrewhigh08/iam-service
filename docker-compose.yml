services:
  iam-service:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: iam_service
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      LOG_LEVEL: info
      LOG_FORMAT: json
      DEV_MODE: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: iam_user
      DB_PASSWORD: iam_password
      DB_NAME: iam_db
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CASBIN_MODEL_PATH: /app/configs/casbin_model.conf
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin123!
      OTEL_ENABLED: "true"
      OTEL_ENDPOINT: jaeger:4317
      OTEL_ENVIRONMENT: local
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: iam_postgres
    environment:
      POSTGRES_DB: iam_db
      POSTGRES_USER: iam_user
      POSTGRES_PASSWORD: iam_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam_user -d iam_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: iam_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.7.0
    container_name: iam_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:12.2.0
    container_name: iam_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    container_name: iam_jaeger
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
