version: "2"

run:
  tests: true
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - exhaustive
    - gocritic
    - gocyclo
    - godot
    - gosec
    - intrange
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks: [hugeParam, rangeValCopy, unnamedResult]
    gocyclo:
      min-complexity: 20
    godot:
      scope: declarations
      exclude:
        - '^\s*@' # swagger annotations
    govet:
      enable: [shadow]
    misspell:
      locale: US
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    staticcheck:
      checks: [all, -ST1000, -ST1003]
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, noctx, errcheck, revive, godot]
      - path: ^test/
        linters: [revive, godot]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/andrewhigh08/iam-service
