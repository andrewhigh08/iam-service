basePath: /
definitions:
  handler.AuditEntriesResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/handler.AuditEntryResponse'
        type: array
      total:
        type: integer
    type: object
  handler.AuditEntryResponse:
    properties:
      action:
        type: string
      actor_id:
        type: integer
      created_at:
        type: string
      details:
        additionalProperties: {}
        type: object
      id:
        type: integer
      ip:
        type: string
      resource_id:
        type: string
      resource_type:
        type: string
      user_agent:
        type: string
    type: object
  handler.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  handler.ChangeRequiredPasswordRequest:
    properties:
      email:
        maxLength: 254
        type: string
      new_password:
        type: string
      old_password:
        type: string
    required:
    - email
    - new_password
    - old_password
    type: object
  handler.Check:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  handler.CreateUserRequest:
    properties:
      email:
        maxLength: 254
        type: string
      full_name:
        type: string
      password:
        type: string
      password_temporary:
        type: boolean
      role:
        enum:
        - admin
        - analyst
        - viewer
        type: string
    required:
    - email
    - full_name
    - password
    - role
    type: object
  handler.CreateUserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
    type: object
  handler.ListUsersResponse:
    properties:
      users:
        items:
          $ref: '#/definitions/handler.UserResponse'
        type: array
    type: object
  handler.LiveResponse:
    properties:
      status:
        type: string
      version:
        type: string
    type: object
  handler.LoginRequest:
    properties:
      email:
        maxLength: 254
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handler.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      reason:
        type: string
      refresh_token:
        type: string
      require_password_change:
        type: boolean
      token_type:
        type: string
      user:
        $ref: '#/definitions/handler.UserInfo'
    type: object
  handler.LogoutRequest:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.MessageResponse:
    properties:
      message:
        type: string
    type: object
  handler.ReadyResponse:
    properties:
      checks:
        additionalProperties:
          $ref: '#/definitions/handler.Check'
        type: object
      status:
        type: string
    type: object
  handler.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.SessionResponse:
    properties:
      created_at:
        type: string
      current:
        type: boolean
      expires_at:
        type: string
      id:
        type: string
      ip:
        type: string
      user_agent:
        type: string
    type: object
  handler.SessionsResponse:
    properties:
      sessions:
        items:
          $ref: '#/definitions/handler.SessionResponse'
        type: array
      total:
        type: integer
    type: object
  handler.TokenPairResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  handler.UserInfo:
    properties:
      email:
        type: string
      id:
        type: integer
      roles:
        items:
          type: string
        type: array
    type: object
  handler.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_blocked:
        type: boolean
    type: object
  response.APIResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.ErrorBody'
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        type: boolean
    type: object
  response.ErrorBody:
    properties:
      code:
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        type: string
    type: object
  response.Meta:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
info:
  contact:
    name: API Support
    url: https://github.com/andrewhigh08/iam-service
  description: 'Identity and Access Management service: login with RS256 access tokens
    and rotating refresh tokens, session management, role-based authorization and
    user administration. Every JSON endpoint except the JWKS and health probes answers
    with the {success, data, error, meta} envelope.'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: IAM Service API
  version: "1.0"
paths:
  /.well-known/jwks.json:
    get:
      description: Returns the JSON Web Key Set (RFC 7517) needed to verify access
        tokens.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Public signing keys
      tags:
      - auth
  /api/v1/change-password:
    post:
      consumes:
      - application/json
      description: Replaces the caller's password, ends every session including the
        caller's and returns a fresh token pair. The new password must satisfy the
        password policy.
      parameters:
      - description: Current and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.TokenPairResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /api/v1/logout-all:
    post:
      description: Ends every session of the caller and revokes all access tokens
        issued so far.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.MessageResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Log out everywhere
      tags:
      - auth
  /api/v1/sessions:
    get:
      description: Lists the live sessions of the caller; the one serving this request
        is marked current.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.SessionsResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: List sessions
      tags:
      - auth
  /api/v1/sessions/{id}:
    delete:
      description: Ends one session of the caller by its id and revokes the access
        token issued with it.
      parameters:
      - description: Session id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.MessageResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Revoke a session
      tags:
      - auth
  /api/v1/users:
    get:
      description: Lists users page by page, optionally filtered by status and a search
        over email and name.
      parameters:
      - default: all
        description: all, active or blocked
        in: query
        name: status
        type: string
      - description: Substring of the email or full name
        in: query
        name: search
        type: string
      - default: 1
        description: Page number, from 1
        in: query
        name: page
        type: integer
      - default: 10
        description: Users per page, 1 to 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.ListUsersResponse'
                meta:
                  $ref: '#/definitions/response.Meta'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a user with the given role. The password must satisfy the
        password policy.
      parameters:
      - description: New user
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.CreateUserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Create a user
      tags:
      - users
  /api/v1/users/{id}:
    get:
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get a user
      tags:
      - users
  /api/v1/users/{id}/audit:
    get:
      description: Lists the most recent audit entries recorded for actions of the
        user, newest first. An id without entries yields an empty list.
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: integer
      - default: 50
        description: Entries to return, 1 to 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.AuditEntriesResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: List a user's audit trail
      tags:
      - audit
  /api/v1/users/{id}/block:
    post:
      description: Blocks the account and ends all of its sessions and tokens.
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.MessageResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Block a user
      tags:
      - users
  /api/v1/users/{id}/unblock:
    post:
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.MessageResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Unblock a user
      tags:
      - users
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Completes a login that required a password change. Only allowed
        while the password is temporary or expired; rate limited like login.
      parameters:
      - description: Email, current and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChangeRequiredPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.TokenPairResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Change a temporary or expired password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Checks the credentials and issues a token pair. When the password
        is temporary or expired the response carries require_password_change=true
        and a reason instead of tokens.
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Ends the session of the refresh token and revokes the access token
        given in the body or in the Authorization header.
      parameters:
      - description: Tokens to invalidate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.MessageResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Log out
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotates the refresh token and issues a new token pair. The previous
        refresh token stops working.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.TokenPairResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Refresh tokens
      tags:
      - auth
  /health/live:
    get:
      description: Reports that the process is running and which version it is.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LiveResponse'
      summary: Liveness probe
      tags:
      - health
  /health/ready:
    get:
      description: Pings the database and Redis; answers 503 with status "degraded"
        when either is unreachable.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ReadyResponse'
      summary: Readiness probe
      tags:
      - health
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
